# Netlify 部署設定：只把網站本身需要的檔案放上線（不含 review/、src/ 等開發資料）
# 免費方案每次正式部署扣 15 點（每月 300 點），所以只有提交訊息含 [deploy] 時才部署，
# 其他推送（例如審查報告）一律略過，不扣點。
[build]
  command = "mkdir -p dist && cp index.html sw.js manifest.webmanifest favicon.png apple-touch-icon.png icon-192.png icon-512.png og.png dist/"
  publish = "dist"
  ignore = "git log -1 --pretty=%B | grep -qF '[deploy]' && exit 1 || exit 0"
