<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="國中社會科（108 課綱）3D 島嶼複習網站：歷史、地理、公民九座島、近四千題。"><style>[hidden]{display:none!important}html,body{margin:0;padding:0}</style></head><body><title>社會科複習島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout：一片海上的 9 座島（3 科 × 3 個年級）；點島嶼飛過去，右側（手機在底部）出現島嶼面板與答題卡；左上角標題與進度，底部是島嶼列 */
:root{
  --fs-1:12px; --fs-2:13px; --fs-3:14px; --fs-4:15px; --fs-5:17px; --fs-6:21px; --fs-7:26px;
  --sky:#bfe1ea; --sky2:#e8f5f7; --sea:#3a97aa;
  --paper:#fbfdfd; --paper2:#eef5f6; --glass:rgba(251,253,253,.88);
  --ink:#1b2a31; --muted:#566870; --line:#d3e1e4; --track:#e1ebed;
  --accent:#e2552d;
  --hist:#c98a3c; --geo:#4f9a45; --civ:#5f7896;
  --ok:#2f8a4e; --ok-bg:#e3f3e8; --bad:#c8402f; --bad-bg:#fbe7e3; --warn:#b7791f;
  --d1:#2f8a4e; --d2:#b7791f; --d3:#c8402f;
  --shadow:0 8px 24px rgba(20,60,70,.16); --shadow-lg:0 18px 48px rgba(20,60,70,.24);
  --f-display:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","KaiTi",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#0e1b2c; --sky2:#1a2c44; --sea:#1b4a60;
    --paper:#13202e; --paper2:#1a2a3b; --glass:rgba(19,32,46,.88);
    --ink:#e5edf1; --muted:#97a9b4; --line:#2a3d50; --track:#24364a;
    --accent:#ff7a52;
    --hist:#e0a65a; --geo:#6fbf63; --civ:#8fa6c6;
    --ok:#4cc27a; --ok-bg:#163526; --bad:#ff7360; --bad-bg:#3b1e1c; --warn:#e3a94a;
    --d1:#4cc27a; --d2:#e3a94a; --d3:#ff7360;
    --shadow:0 8px 24px rgba(0,0,0,.4); --shadow-lg:0 18px 48px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky:#0e1b2c; --sky2:#1a2c44; --sea:#1b4a60;
  --paper:#13202e; --paper2:#1a2a3b; --glass:rgba(19,32,46,.88);
  --ink:#e5edf1; --muted:#97a9b4; --line:#2a3d50; --track:#24364a;
  --accent:#ff7a52;
  --hist:#e0a65a; --geo:#6fbf63; --civ:#8fa6c6;
  --ok:#4cc27a; --ok-bg:#163526; --bad:#ff7360; --bad-bg:#3b1e1c; --warn:#e3a94a;
  --d1:#4cc27a; --d2:#e3a94a; --d3:#ff7360;
  --shadow:0 8px 24px rgba(0,0,0,.4); --shadow-lg:0 18px 48px rgba(0,0,0,.5);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:var(--fs-4);line-height:1.6;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:linear-gradient(var(--sky2),var(--sky))}
#scene.dragging{cursor:grabbing}
#scene.pointing{cursor:pointer}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}

.ui{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  pointer-events:none}
.ui > *{pointer-events:auto}
.spacer{flex:1;pointer-events:none}

.hud{align-self:flex-start;width:min(290px,100%);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:16px 16px 12px;box-shadow:var(--shadow)}
.eyebrow{margin:0;font-size:var(--fs-1);letter-spacing:.14em;color:var(--muted)}
h1{margin:2px 0 12px;font-family:var(--f-display);font-weight:700;font-size:var(--fs-7);line-height:1.15;letter-spacing:.06em;text-wrap:balance}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar span{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--hist),var(--geo),var(--civ));transition:width .6s ease}
.progress p{margin:8px 0 0;font-size:var(--fs-2);color:var(--muted);font-variant-numeric:tabular-nums}
.loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:linear-gradient(var(--sky2),var(--sky));transition:opacity .6s ease;padding-inline:16px}
.loader.done{opacity:0;pointer-events:none}
.ld-card{display:grid;justify-items:center;gap:8px;text-align:center}
.ld-title{margin:0;font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:.08em}
.ld-msg{margin:4px 0 8px;font-size:var(--fs-3);color:var(--muted)}
.ld-bar{width:180px;height:6px;border-radius:99px;background:var(--track);overflow:hidden;position:relative}
.ld-bar i{position:absolute;top:0;bottom:0;width:40%;border-radius:99px;background:linear-gradient(90deg,var(--hist),var(--geo),var(--civ));animation:ld 1.2s ease-in-out infinite}
@keyframes ld{from{left:-40%}to{left:100%}}
#ldLite{margin-top:12px}
.hud-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#examBtn,#searchBtn,#reviewBtn{color:var(--ink);font-weight:600}
#reviewBtn.hasdue{background:var(--accent);border-color:var(--accent);color:#fff}
#reviewBtn:disabled{opacity:.6;cursor:default}
.nextrev{font-size:var(--fs-1);color:var(--muted);margin-right:auto}
.tool{padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--paper);font-size:var(--fs-2);color:var(--muted);cursor:pointer}
.tool[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.qprog{display:grid;gap:4px;margin:0 0 12px}
.qprog i{height:6px;border-radius:99px;background:var(--track)}
.qprog i.right{background:var(--ok)}
.qprog i.wrong{background:var(--bad)}
.qprog i.now{background:var(--ink)}
.qnum{font-size:var(--fs-2);color:var(--muted);font-variant-numeric:tabular-nums}
.qnum b{font-size:var(--fs-5);color:var(--ink)}
.qtags{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tagchip{font-size:var(--fs-1);padding:2px 8px;border-radius:99px;background:var(--paper2);border:1px solid var(--line);color:var(--muted)}
.fb-head{display:flex;align-items:center;gap:8px}
.fb-icon{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:var(--paper);font-size:var(--fs-2);font-weight:700}
.feedback.bad .fb-icon{background:var(--bad)}
.fb-ans{display:flex;align-items:baseline;gap:8px;margin-top:8px;font-weight:500}
.fb-label{flex:none;font-size:var(--fs-1);font-weight:700;padding:1px 8px;border-radius:6px;background:var(--ok);color:var(--paper)}
.feedback .fb-ex{margin:8px 0 0;line-height:1.75}
.fb-foot{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:4px}
body.big .qtext{font-size:var(--fs-7)}
body.big .ctx{font-size:var(--fs-5)}
body.big .opt{font-size:var(--fs-5);padding:16px 16px}
body.big .feedback p,body.big .feedback strong{font-size:var(--fs-5)}
body.big .wq,body.big .wa,body.big .nb-ex{font-size:var(--fs-5)}
.back{margin-top:12px;display:inline-flex;align-items:center;gap:8px;padding:8px 12px 8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:var(--fs-3);cursor:pointer}
.back:hover{border-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:8px 0 0;padding:0;list-style:none;font-size:var(--fs-2);color:var(--muted)}
.legend li{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}

.bottom{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0;pointer-events:none}
.bottom > *{pointer-events:auto}
.hint{margin:0;padding:8px 16px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:var(--fs-2);color:var(--muted);box-shadow:var(--shadow);transition:opacity .4s;text-align:center}
.hint.gone{opacity:0;pointer-events:none}
.dock{max-width:100%;overflow-x:auto;scrollbar-width:none;padding:2px}
.dock::-webkit-scrollbar{display:none}
.dock{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent);padding-inline:12px}
.subrow{display:flex;align-items:center;gap:8px}
.mini{width:44px;height:4px;border-radius:99px;background:var(--track);overflow:hidden}
.mini i{display:block;height:100%;width:0;background:var(--c);border-radius:99px}
.chip.wip{opacity:.78}
.dock-row{display:flex;gap:8px;width:max-content;margin:0 auto}
.chip{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 12px;border-radius:12px;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);cursor:pointer;white-space:nowrap;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.chip:hover{transform:translateY(-2px);border-color:var(--c)}
.chip.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c),var(--shadow)}
.chip .txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.chip .nm{font-weight:700;font-size:var(--fs-3)}
.chip .sub{font-size:var(--fs-1);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.wip .nm{font-weight:500}

/* 浮動標籤 */
.tag3d{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;padding:4px 12px 4px 8px;border-radius:999px;background:var(--paper);border:1.5px solid var(--c);color:var(--ink);font:500 13px/1.3 var(--f-body);white-space:nowrap;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.16);transition:opacity .25s, scale .15s;will-change:transform;pointer-events:auto}
.tag3d::after{content:"";position:absolute;left:50%;bottom:-6px;width:9px;height:9px;background:var(--paper);border-right:1.5px solid var(--c);border-bottom:1.5px solid var(--c);transform:translateX(-50%) rotate(45deg)}
.tag3d .sc{color:var(--muted);font-size:var(--fs-1);font-variant-numeric:tabular-nums}
.tag3d.hover,.tag3d:hover{scale:1.08}
.tag3d.island{padding:4px 12px 4px 8px;border-radius:12px;flex-direction:row}
body:not(.focused) .tag3d.island .sc{display:none}
body:not(.focused) .tag3d.island:hover .sc,body:not(.focused) .tag3d.island.hover .sc{display:block}
.tag3d.island .nm{font-family:var(--f-display);font-size:var(--fs-4);font-weight:700;letter-spacing:.04em}
.tag3d.island .col{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.tag3d.wip{border-style:dashed}
.bubble{position:absolute;left:0;top:0;max-width:min(260px,70vw);display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:12px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);font-size:var(--fs-2);line-height:1.45;box-shadow:var(--shadow);pointer-events:none;z-index:200}
.bubble b{font-size:var(--fs-3)}
.bubble small{color:var(--muted);font-size:var(--fs-1)}
.ring{width:13px;height:13px;border-radius:50%;flex:none;background:conic-gradient(var(--c) calc(var(--p,0)*1%), transparent 0);box-shadow:inset 0 0 0 2px var(--c)}

/* 面板 */
.panel{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100% - 32px));display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);overflow:hidden;animation:slideIn .3s ease}
@keyframes slideIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.panel-head{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:start;padding:16px 16px 16px 20px;border-bottom:1px solid var(--line);background:var(--paper2)}
.zone-tag{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-1);letter-spacing:.12em;color:var(--muted)}
.panel-head h2{margin:0;font-family:var(--f-display);font-size:var(--fs-7);line-height:1.2;letter-spacing:.04em;text-wrap:balance}
.unit{margin:0;font-size:var(--fs-2);color:var(--muted)}
.close{grid-row:1 / span 3;grid-column:2;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:var(--fs-6);line-height:1;cursor:pointer}
.close:hover{border-color:var(--ink)}
.panel-body{flex:1;min-height:0;overflow-y:auto;padding:16px 20px 24px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px 12px;border-radius:12px;background:var(--paper2);display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:var(--fs-7);line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:var(--fs-1);color:var(--muted)}
.section-label{margin:16px 0 8px;font-size:var(--fs-1);letter-spacing:.14em;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--track)}
.seg button{padding:8px 4px;border-radius:9px;border:0;background:transparent;font-size:var(--fs-3);cursor:pointer;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--paper);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.linkbtn{margin-top:8px;padding:0;border:0;background:none;font-size:var(--fs-2);color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkbtn[aria-pressed="true"]{color:var(--warn)}
.copybox{width:100%;box-sizing:border-box;min-height:120px;margin-top:12px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--paper2);color:var(--ink);font:13px/1.5 var(--f-body)}
.seg3{grid-template-columns:repeat(3,1fr)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.fchip{padding:4px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--paper);font-size:var(--fs-2);cursor:pointer;font-variant-numeric:tabular-nums}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.nb{margin-top:16px}
.nb-lm{margin:0 0 2px;font-size:var(--fs-1);color:var(--muted)}
.nb-ex{margin:12px 0 0;padding-top:8px;border-top:1px dashed var(--line);font-size:var(--fs-3);line-height:1.7;color:var(--muted)}
.seg-note{margin:8px 0 0;font-size:var(--fs-2);color:var(--muted)}
.lm-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.lm-row{width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;padding:12px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;transition:border-color .15s}
.lm-row:hover{border-color:var(--ink)}
.lm-name{font-weight:700;font-size:var(--fs-4);display:flex;align-items:center;gap:8px;min-width:0}
.lm-unit{grid-column:1;font-size:var(--fs-2);color:var(--muted);min-width:0}
.lm-meta{grid-column:2;grid-row:1 / span 2;text-align:right;font-size:var(--fs-1);color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.35}
.lm-meta b{display:block;font-size:var(--fs-4);color:var(--ink)}
.meter{grid-column:1 / span 2;height:4px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--ok);border-radius:99px}
.flag{font-size:var(--fs-1);font-weight:700;color:var(--bad);border:1px solid var(--bad);border-radius:6px;padding:0 4px;line-height:1.5}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.plan li{padding:4px 12px;border-radius:99px;background:var(--paper2);border:1px solid var(--line);font-size:var(--fs-2)}
.note{margin:0;font-size:var(--fs-4)}
.fine{margin:16px 0 0;font-size:var(--fs-2);color:var(--muted)}

.qmeta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:var(--fs-2);color:var(--muted);font-variant-numeric:tabular-nums}
.qmeta .left{display:flex;align-items:center;gap:8px}
.pill{font-size:var(--fs-1);font-weight:700;padding:1px 8px;border-radius:99px;border:1.5px solid var(--dc);color:var(--dc)}
.dots{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--track)}
.dots i.right{background:var(--ok)}
.dots i.wrong{background:var(--bad)}
.dots i.now{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--ink)}
.ctx{margin:12px 0 0;padding:12px 12px;border-radius:12px;background:var(--paper2);border:1px solid var(--line);font-size:var(--fs-4);line-height:1.65}
.ctx-tag{display:inline-block;margin-right:8px;padding:0 8px;border-radius:6px;background:var(--ink);color:var(--paper);font-size:var(--fs-1);font-weight:700;vertical-align:1px}
.nb-ctx{margin:0 0 4px;font-size:var(--fs-2);color:var(--muted);padding:8px 8px;border-radius:8px;background:var(--paper)}
.qtext{font-family:var(--f-display);font-size:var(--fs-6);line-height:1.55;margin:16px 0 16px;text-wrap:pretty}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opt{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-size:var(--fs-5);cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not(:disabled){border-color:var(--ink);background:var(--paper2)}
.opt:active:not(:disabled){transform:scale(.985)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn:active:not(:disabled),.chip:active,.icon-btn:active{transform:scale(.97)}
.opt:disabled{cursor:default}
.opt .key{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--track);font-size:var(--fs-2);font-weight:700}
.opt.is-right{border-color:var(--ok);background:var(--ok-bg)}
.opt.is-right .key{background:var(--ok);color:var(--paper)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.is-wrong .key{background:var(--bad);color:var(--paper)}
.otext{min-width:0}
.seq{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.seqi{padding:2px 8px;border-radius:7px;background:var(--paper2);border:1px solid var(--line);font-size:.92em;line-height:1.4}
.arr{color:var(--muted);font-size:.85em}
.opt.is-right .seqi{background:var(--paper)}
.wa .seq{margin-top:4px;font-weight:500}
.feedback{scroll-margin-bottom:96px;margin-top:16px;padding:12px 16px;border-radius:12px;background:var(--ok-bg)}
.feedback.bad{background:var(--bad-bg)}
.feedback strong{color:var(--ok)}
.feedback.bad strong{color:var(--bad)}
.feedback p{margin:4px 0 0;font-size:var(--fs-4)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{padding:12px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-size:var(--fs-4);font-weight:500;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}

(function(root){
function hash(s){let h=2166136261;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function sample(arr,n,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a.slice(0,n);}
const fill=(t,k,v)=>t.replace('{k}',k).replace('{v}',v);
const uniq=a=>[...new Set(a)];
const PERMS=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];

function buildBank(HAND,GEN,PERIODS){
  const bank={};
  Object.keys(GEN).forEach(lm=>{
    const list=[];
    (HAND[lm]||[]).forEach((h,i)=>list.push({id:lm+'-h'+i,lm,d:h[0],q:h[1],c:h[2],w:[h[3],h[4],h[5]],ex:h[6],src:'h',ctx:h[7]||null,fig:h[8]||null}));
    const spec=GEN[lm], r=rng(hash(lm)); let n=0;
    let tags=[];
    // 重疊的資料互不當誘答；先洗牌整個候選池再過濾，未受影響的題目選項維持不變
    const ov=spec.ov||[], clash=(a,b)=>a&&b&&a!==b&&ov.some(g=>g.includes(a)&&g.includes(b));
    const pick=(pool,ok)=>sample(pool,pool.length,r).filter(ok).slice(0,3);
    // tags：同一筆資料（鍵與值）出的題目共用標籤，同一輪抽題時避免同時出現
    const add=(d,q,c,w,ex,t)=>{ if(w.length<3||new Set([c].concat(w)).size<4) return false; list.push({id:lm+'-g'+(n++),lm,d,q,c,w,ex,src:'g',t:t||null,tags}); return true; };

    (spec.sets||[]).forEach(set=>{
      const vals=uniq(set.items.map(i=>i[1]));
      const keyOf=x=>(set.items.find(i=>i[1]===x)||[])[0], valOf=x=>(set.items.find(i=>i[0]===x)||[])[1];
      set.items.forEach(([k,v,note])=>{
        const tip=note?'補充：'+note+'。':'';
        tags=[lm+':'+k].concat(set.oneway?[]:[lm+':'+v]);
        if(set.rel==='cause'){
          const wv=pick(vals.filter(x=>x!==v),x=>!clash(k,keyOf(x))), wk=pick(set.items.filter(i=>i[0]!==k).map(i=>i[0]),x=>!clash(k,x));
          add(set.db||2, '「'+k+'」帶來的結果是？', v, wv, '因為「'+k+'」，所以'+v+'。'+tip+'其他選項也是本單元常見的結果，但原因不同：'+wv.map(x=>x+'，是因為'+keyOf(x)).join('；')+'。','cause');
          add(set.da||3, '「'+v+'」最主要的原因是？', k, wk, v+'，最主要是因為「'+k+'」。'+tip+'其他選項會帶來別的結果：'+wk.map(x=>'「'+x+'」導致'+valOf(x)).join('；')+'。','cause');
          return;
        }
        if(set.qb){ const pool=uniq(vals.filter(x=>x!==v).concat(set.pool||[])); const w=pick(pool,x=>!clash(k,keyOf(x)));
          const other=set.oneway?'':w.map(x=>{ const kk=keyOf(x); return kk?'「'+x+'」說的是'+kk:null; }).filter(Boolean).join('；');
          add(set.db||2, fill(set.qb,k,v), v, w, set.oneway ? '「'+k+'」→ '+v+'。'+tip : '「'+k+'」的重點是：'+v+'。'+tip+(other?'容易混淆的選項：'+other+'。':'')); }
        if(set.qa && !set.oneway){ const keys=set.items.filter(i=>i[1]!==v).map(i=>i[0]); const w=pick(keys,x=>!clash(k,x));
          const other=w.map(x=>'「'+x+'」是'+valOf(x)).join('；');
          add(set.da||1, fill(set.qa,k,v), k, w, '「'+v+'」說的是「'+k+'」。'+tip+'其他選項：'+other+'。'); }
      });
    });

    // 精寫題若提到某筆資料的鍵（例如人名、制度名），也掛上同一個標籤
    const keys=uniq([].concat(...(spec.sets||[]).map(st=>st.items.map(i=>i[0])))).filter(k=>k.length>=2);
    list.forEach(q=>{ if(q.src!=='h') return; const txt=q.q+'|'+q.c; q.tags=keys.filter(k=>txt.includes(k)).map(k=>lm+':'+k); });
    // 去除重複：生成題若與同章精寫題考同一件事（答案相同且同一筆資料），保留精寫題
    const hand=list.filter(q=>q.src==='h');
    for(let i=list.length-1;i>=0;i--){ const q=list[i]; if(q.src!=='g') continue;
      if(hand.some(h=>h.c===q.c && (h.tags||[]).some(t=>q.tags.includes(t)))) list.splice(i,1); }
    // 依使用者偏好：不再生成年份、年代區間與事件先後排序題（events 只保留給跨時期的「屬於哪個時期」題）
    bank[lm]=list;
  });

  // 跨時期題：只出現在「整座島隨機」
  const cross=[]; const r=rng(hash('cross')); let n=0;
  const addc=(d,q,c,w,ex)=>{ if(new Set([c].concat(w)).size<4) return false; cross.push({id:'x-g'+(n++),lm:'_x',d,q,c,w,ex,src:'g'}); return true; };
  const evs=[];
  Object.keys(GEN).forEach(lm=>(GEN[lm].events||[]).forEach(e=>{ const p=e.length>2?e[2]:GEN[lm].period; evs.push({y:e[0],t:e[1],p,lm}); }));
  evs.forEach(e=>{ if(!e.p) return; addc(1,'「'+e.t+'」發生在哪一個時期？',e.p,sample(PERIODS.filter(x=>x!==e.p),3,r),'「'+e.t+'」發生於 '+e.y+' 年，屬於'+e.p+'。'); });
  bank._x=cross;
  // 跨章節完全相同的題幹只保留第一題（精寫題優先）
  const seen=new Set();
  Object.keys(bank).forEach(k=>{ bank[k].sort((a,b)=>(a.src==='h'?0:1)-(b.src==='h'?0:1)); });
  Object.keys(bank).forEach(k=>{ bank[k]=bank[k].filter(q=>{ const key=q.q.replace(/\s/g,''); if(seen.has(key)) return false; seen.add(key); return true; }); });
  return bank;
}
root.buildBank=buildBank;
})(typeof window!=='undefined'?window:globalThis);

// 紀錄格式：[作答次數, 答對次數, 最近一次是否答對, 連續答對次數]
// 間隔複習：紀錄第 5 欄是「下次複習日」（本地日期序號）。答對後依連續答對次數隔 1、3、7、14、30、60 天；答錯隔天再出現
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/86400000);
const INTV=[1,1,3,7,14,30,60];
function record(id,ok){ const r=ST.q[id]||[0,0,0,0]; const st=r[3]!=null?r[3]:(r[2]?1:0); r[0]++; if(ok) r[1]++; r[2]=ok?1:0; r[3]=ok?st+1:0; r[4]=today()+(ok?INTV[Math.min(r[3],6)]:1); ST.q[id]=r; save(); return r[4]-today(); }
// 舊紀錄沒有複習日：答錯的今天就到期，答對的依連續次數排定
function migrateDue(){ const t=today(); Object.keys(ST.q).forEach(id=>{ const r=ST.q[id]; if(r && r[4]==null){ const st=r[3]!=null?r[3]:(r[2]?1:0); r[4]=r[2]?t+INTV[Math.min(st,6)]:t; } }); }
migrateDue();
const streakOf=r=>r?(r[3]!=null?r[3]:(r[2]?1:0)):0;
const MASTER=2;
function statsOf(list){
  let seen=0,mast=0,att=0,cor=0,ok=0;
  list.forEach(q=>{ const r=ST.q[q.id]; if(r){ seen++; att+=r[0]; cor+=r[1]; if(r[2]) ok++; if(streakOf(r)>=MASTER) mast++; } });
  return {total:list.length, seen, mast, ok, acc: att? cor/att : null, att};
}
const pct=x=>x==null?'—':Math.round(x*100)+'%';
// 島嶼成長：看「目前答對中」的題數（最近一次答對就算），達 8%／25%／50% 各長出一階
// 答錯會把那題扣回來；最近答錯 4 題以上且答對率低於七成會起霧
const STAGES=[0.08,0.25,0.5], STAGE_NAME=['荒島','小聚落','熱鬧聚落','繁榮之島'];
function growthOf(id){ const list=BANK[id], t=statsOf(list);
  const ok=list.filter(q=>ST.q[q.id]&&ST.q[q.id][2]).length, m=ok/t.total; let stage=0; STAGES.forEach((x,i)=>{ if(m>=x) stage=i+1; });
  const wrong=list.filter(q=>ST.q[q.id]&&!ST.q[q.id][2]).length;
  const need=stage<3?Math.max(1,Math.ceil(STAGES[stage]*t.total)-ok):0;
  return {stage, fog: wrong>=4 && t.acc!=null && t.acc<0.7, wrong, m, ok, need}; }

// 題目附圖：氣候圖、人口金字塔、堆疊長條圖（以 SVG 繪製，跟著深淺色主題）
function figSVG(f){
  const W=320, H=200, L=38, R=34, T=14, B=30, pw=W-L-R, ph=H-T-B;
  const tx=(x,y,t,a,cls)=>'<text x="'+x+'" y="'+y+'" text-anchor="'+(a||'middle')+'" class="'+(cls||'fx')+'">'+esc(t)+'</text>';
  let g='';
  if(f.t==='climate'){
    const tmin=Math.min(0,Math.floor(Math.min(...f.temp)/10)*10), tmax=Math.max(30,Math.ceil(Math.max(...f.temp)/10)*10), nt=(tmax-tmin)/10;
    const rstep=Math.max(25,Math.ceil(Math.max(...f.rain)/nt/25)*25), rmax=rstep*nt;
    const bw=pw/12, ty=v=>T+ph-(v-tmin)/(tmax-tmin)*ph;
    for(let k=0;k<=nt;k++){ const y=T+ph*k/nt; g+='<line x1="'+L+'" x2="'+(L+pw)+'" y1="'+y+'" y2="'+y+'" class="fg"/>'+tx(L-4,y+4,rmax-rstep*k,'end')+tx(L+pw+4,y+4,tmax-10*k,'start'); }
    f.rain.forEach((v,i)=>{ const h=v/rmax*ph; g+='<rect x="'+(L+i*bw+2)+'" y="'+(T+ph-h)+'" width="'+(bw-4)+'" height="'+h+'" class="fr"/>'; });
    g+='<polyline points="'+f.temp.map((v,i)=>(L+i*bw+bw/2)+','+ty(v)).join(' ')+'" class="ft"/>';
    f.temp.forEach((v,i)=>{ g+='<circle cx="'+(L+i*bw+bw/2)+'" cy="'+ty(v)+'" r="2.6" class="ftd"/>'; });
    for(let i=0;i<12;i++) g+=tx(L+i*bw+bw/2,H-B+14,i+1);
    g+=tx(L-4,H-4,'雨量 mm','end','fx fs')+tx(L+pw/2,H-4,'月','middle','fx fs')+tx(L+pw+4,H-4,'氣溫 °C','start','fx fs');
  } else if(f.t==='pyramid'){
    const n=f.m.length, cx=L+pw/2, mx=Math.max(...f.m,...f.f), bh=ph/n, sc=v=>v/mx*(pw/2-18);
    f.m.forEach((v,i)=>{ const y=T+ph-(i+1)*bh; g+='<rect x="'+(cx-14-sc(v))+'" y="'+(y+1)+'" width="'+sc(v)+'" height="'+(bh-2)+'" class="fm"/><rect x="'+(cx+14)+'" y="'+(y+1)+'" width="'+sc(f.f[i])+'" height="'+(bh-2)+'" class="ff"/>'+tx(cx,y+bh/2+4,f.ages[i],'middle','fx fs'); });
    g+=tx(L+20,H-6,'男','middle')+tx(L+pw-20,H-6,'女','middle')+tx(cx,H-6,'年齡','middle','fx fs');
  } else if(f.t==='stack'){
    const n=f.labels.length, bw=pw/n, cols=['fs1','fs2','fs3','fs4'];
    for(let k=0;k<=4;k++){ const y=T+ph*k/4; g+='<line x1="'+L+'" x2="'+(L+pw)+'" y1="'+y+'" y2="'+y+'" class="fg"/>'+tx(L-4,y+4,(100-25*k)+'%','end'); }
    f.labels.forEach((lb,i)=>{ let acc=0; f.series.forEach((s,j)=>{ const v=s.vals[i], h=v/100*ph; g+='<rect x="'+(L+i*bw+bw*0.2)+'" y="'+(T+ph-acc-h)+'" width="'+(bw*0.6)+'" height="'+h+'" class="'+cols[j]+'"/>'; if(h>14) g+=tx(L+i*bw+bw/2,T+ph-acc-h/2+4,v,'middle','fx fin'); acc+=h; }); g+=tx(L+i*bw+bw/2,H-B+14,lb); });
    g+=f.series.map((s,j)=>'<rect x="'+(L+j*86)+'" y="'+(H-12)+'" width="9" height="9" class="'+cols[j]+'"/>'+tx(L+j*86+13,H-4,s.name,'start','fx fs')).join('');
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(f.s||'題目附圖')+'">'+g+'</svg>'+(f.s?'<figcaption>'+esc(f.s)+'</figcaption>':'');
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

// 抽題：優先抽沒做過的，其次是上次答錯的，最後才是答對過的
function draw(list,n,diff){
  let pool = diff==='mix' ? list : list.filter(q=>q.d===+diff);
  if(!pool.length) pool=list;
  const scored=pool.map(q=>{ const r=ST.q[q.id]; let p = !r ? 0 : (!r[2] ? 1 : (streakOf(r)<MASTER ? 1.5 : 2.2+r[0]*0.25)); return {q, p:p+Math.random()*0.95}; });
  scored.sort((a,b)=>a.p-b.p);
  // 同一輪避免出現考同一件事的題目（同一筆資料的正反題、精寫題與生成題重疊）
  const used=new Set(), pick=[], rest=[];
  scored.forEach(x=>{ if(pick.length>=n) return; const tg=x.q.tags||[]; if(tg.some(g=>used.has(g))){ rest.push(x); return; } tg.forEach(g=>used.add(g)); pick.push(x); });
  for(let i=0;pick.length<n && i<rest.length;i++) pick.push(rest[i]);
  return shuffle(pick.map(x=>x.q));
}

function scopeInfo(o){
  if(o.scope==='lm'){ const l=LM_INFO[o.id]; return {isl:l.isl, title:l.name, sub:l.unit, list:BANK[o.id]}; }
  if(o.scope==='link'){ const L=LINKS[o.id]; return {isl:LM_INFO[L.a].isl, title:'因果航線：'+L.title, sub:LM_INFO[L.a].name+' → '+LM_INFO[L.b].name, list:linkPool(o.id)}; }
  const isl=ISL[o.id];
  if(o.scope==='island') return {isl:o.id, title:'整座島隨機', sub:isl.name+(o.id==='twh'?'全部小主題＋跨時期與因果航線題':'全部 '+isl.lms.length+' 個小主題'), list:islandPool(o.id)};
  if(o.scope==='weak') return {isl:o.id, title:'弱點加強', sub:'上次答錯的題目', list:islandPool(o.id).filter(q=>ST.q[q.id] && !ST.q[q.id][2])};
  if(o.scope==='preview') return {isl:o.id, title:'預覽題', sub:'第一版留下的題目', list:PV[o.id]||[]};
  if(o.scope==='retry') return {isl:o.isl, title:'錯題重練', sub:'剛才答錯的題目', list:o.list};
  if(o.scope==='exam'){ const isls=examIslands(o.subj); return {isl:null, title:'會考模擬', sub:(o.subj==='all'?'三科':SUBJ[o.subj].name)+'混合 '+o.n+' 題．計時作答', list:isls.reduce((a,i)=>a.concat(islandPool(i.id)),[])}; }
  if(o.scope==='wrong'){ const L=wrongAll().filter(q=>o.subj==='all'||subjOf(q)===o.subj); return {isl:null, title:'錯題島', sub:(o.subj==='all'?'所有島':SUBJ[o.subj].name)+'上次答錯的題目，共 '+L.length+' 題', list:L}; }
  if(o.scope==='cross'){ const L=CROSS[o.id]; return {isl:null, title:'跨科航線：'+L.title, sub:LM_INFO[L.a].name+' → '+LM_INFO[L.b].name, list:crossPool(o.id)}; }
  if(o.scope==='review'){ const L=dueList(); return {isl:null, title:'今日複習', sub:'今天到期該複習的題目共 '+L.length+' 題', list:L}; }
  if(o.scope==='search') return {isl:null, title:'搜尋：'+o.term, sub:'題目或選項含有「'+o.term+'」', list:o.list};
}
const islOf=q=>LM_INFO[q.lm]?LM_INFO[q.lm].isl:((q.lm==='_x'||q.lm==='_lk')?'twh':(q.lm==='_cx'?LM_INFO[CROSS[q.cx].a].isl:null));
const examIslands=subj=>ISLANDS.filter(i=>i.ready && (subj==='all'||i.subj===subj));
// 會考模擬：各島平均抽題，再整體打散
function examDraw(o){
  const isls=examIslands(o.subj); let out=[];
  isls.forEach((isl,k)=>{ const share=Math.floor(o.n/isls.length)+(k<o.n%isls.length?1:0); out=out.concat(draw(islandPool(isl.id),share,'mix')); });
  return shuffle(out);
}
const fmtTime=ms=>{ const t=Math.floor(ms/1000); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); };
let timerT=0;
function startQuiz(o){
  const info=scopeInfo(o); if(!info || !info.list.length) return;
  if(info.isl && focusId!==info.isl){ focusId=info.isl; $('#backBtn').hidden=false; if(scene3d) scene3d.focus(info.isl); }
  const diff = (o.scope==='lm'||o.scope==='island') ? ST.diff : 'mix';
  let qs;
  if(o.scope==='retry') qs=shuffle(info.list);
  else if(o.scope==='link'||o.scope==='cross'){ // 本線題一定先抽，再用兩島的因果題補滿
    const tag=o.scope==='link'?'_lk':'_cx', own=info.list.filter(q=>q.lm===tag), rest=info.list.filter(q=>q.lm!==tag);
    const a=draw(own,Math.min(own.length,Math.ceil(ST.n/2)),'mix'); qs=shuffle(a.concat(draw(rest,ST.n-a.length,'mix')));
  } else if(o.scope==='exam') qs=examDraw(o);
  else if(o.scope==='review') qs=shuffle(info.list.slice(0,Math.max(ST.n,10)));
  else if(o.scope==='wrong') qs=draw(info.list,Math.max(ST.n,10),'mix');
  else qs=draw(info.list, ST.n, diff);
  S={o, info, qs, i:0, results:[], wrong:[], answered:false, opts:[], diff, t0:Date.now()};
  view='quiz'; markInteracted();
  const isl=info.isl?ISL[info.isl]:null;
  setHead(isl?isl.name+(diff==='mix'?'':'．'+DIFF[diff].name):'全部島嶼', info.title, info.sub, isl?isl.subj:(o.subj&&o.subj!=='all'?o.subj:'hist'));
  clearInterval(timerT);
  if(o.scope==='exam') timerT=setInterval(()=>{ const el=document.getElementById('qtimer'); if(!S||S.o.scope!=='exam'||view!=='quiz'){ clearInterval(timerT); return; } if(el) el.textContent='⏱ '+fmtTime(Date.now()-S.t0); },1000);
  openPanel(); renderQ(); refreshProgress();
  if(o.scope==='lm'){ lmFocus=o.id; linkFocus=null; if(scene3d) scene3d.focusLm(o.id); }
  if(o.scope==='link'){ linkFocus=o.id; lmFocus=null; if(scene3d) scene3d.focusLink(o.id); }
  if(o.scope==='cross'){ crossFocus=o.id; if(scene3d) scene3d.focusCross(o.id); }
}
function renderQ(){
  const q=S.qs[S.i]; S.opts=shuffle([q.c].concat(q.w)); S.answered=false;
  const segs=S.qs.map((_,k)=>{ let c=''; if(k<S.i) c=S.results[k]?'right':'wrong'; else if(k===S.i) c='now'; return '<i class="'+c+'"></i>'; }).join('');
  const lmTag = q.lm==='_cx' ? '<span class="tagchip lk">⛵ '+esc(CROSS[q.cx].title)+'</span>' : q.lm==='_lk' ? '<span class="tagchip lk">⇢ '+esc(LINKS[q.link].title)+'</span>' : ((S.o.scope!=='lm' && lmName(q.lm)) ? '<span class="tagchip">'+lmName(q.lm)+'</span>' : '');
  body.innerHTML=
    '<div class="qprog" style="grid-template-columns:repeat('+S.qs.length+',1fr)" role="progressbar" aria-valuemin="0" aria-valuemax="'+S.qs.length+'" aria-valuenow="'+S.i+'">'+segs+'</div>'+

    (q.ctx?'<div class="ctx"><span class="ctx-tag">素養情境</span>'+esc(q.ctx)+'</div>':'')+

    '<ol class="opts" aria-labelledby="qtext">'+S.opts.map((o,k)=>'<li><button type="button" class="opt" data-k="'+k+'"><span class="key">'+'ABCD'[k]+'</span><span class="otext">'+fmtOpt(o)+'</span></button></li>').join('')+'</ol>'+
    '<div class="feedback" id="fb" hidden aria-live="polite"></div>'+
    '<div class="actions qactions" id="qact" hidden><button type="button" class="btn primary" id="nextBtn">'+(S.i+1<S.qs.length?'下一題':'看成績')+'</button></div>';
  body.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.k)));

function answer(k){
  if(!S || S.answered) return;
  S.answered=true;
  const q=S.qs[S.i], ok=S.opts[k]===q.c;
  S.results.push(ok); if(!ok) S.wrong.push(q);
  const gap=record(q.id, ok); if(ok && scene3d && scene3d.cheer) scene3d.cheer();
  body.querySelectorAll('.opt').forEach((b,idx)=>{ b.disabled=true; if(S.opts[idx]===q.c) b.classList.add('is-right'); if(idx===k && !ok) b.classList.add('is-wrong'); });
  const fb=$('#fb'); fb.hidden=false; fb.className='feedback'+(ok?'':' bad');
  fb.innerHTML='<div class="fb-head"><span class="fb-icon" aria-hidden="true">'+(ok?'✓':'✕')+'</span><strong>'+(ok?'答對了':'答錯了')+'</strong></div>'+(ok?'':'<div class="fb-ans"><span class="fb-label">正解</span><span>'+fmtOpt(q.c)+'</span></div>')+'<p class="fb-ex">'+esc(q.ex)+'</p><div class="fb-foot"><span class="nextrev">下次複習：'+(gap<=1?'明天':gap+' 天後')+'</span><button type="button" class="linkbtn" id="flagBtn" aria-pressed="'+!!ST.flag[q.id]+'">⚑ '+(ST.flag[q.id]?'已標記（再按取消）':'這題有疑問')+'</button></div>';
  $('#flagBtn').addEventListener('click',e=>{ if(ST.flag[q.id]) delete ST.flag[q.id]; else ST.flag[q.id]=1; save(); e.currentTarget.setAttribute('aria-pressed',String(!!ST.flag[q.id])); e.currentTarget.textContent='⚑ '+(ST.flag[q.id]?'已標記（再按取消）':'這題有疑問'); });
  $('#qact').hidden=false; const nb=$('#nextBtn'); nb.focus({preventScroll:true});
  fb.scrollIntoView({block:'nearest',behavior:reduceMotion?'auto':'smooth'});
}
function next(){ if(!S) return; S.i++; if(S.i<S.qs.length) renderQ(); else renderResult(); }
function renderResult(){
  view='result'; refreshProgress();
  const n=S.qs.length, c=S.results.filter(Boolean).length, ratio=c/n;
  const msg = ratio===1 ? '全對！這一輪的題目都掌握了。' : ratio>=0.7 ? '不錯！把下面答錯的題目看熟就更穩了。' : '先看看下面的錯題重點，再挑戰一次。';
  const by={1:[0,0],2:[0,0],3:[0,0]}; S.qs.forEach((q,i)=>{ by[q.d][1]++; if(S.results[i]) by[q.d][0]++; });
  const bd=[1,2,3].filter(d=>by[d][1]).map(d=>'<li><span class="pill" style="--dc:'+DIFF[d].css+'">'+DIFF[d].name+'</span>'+by[d][0]+' / '+by[d][1]+'</li>').join('');
  clearInterval(timerT);
  // 各小主題表現（會考模擬與搜尋改以島為單位）：題目來自兩個以上分組時才顯示
  const byIsl=S.o.scope==='exam'||S.o.scope==='search'||S.o.scope==='review'||S.o.scope==='wrong';
  const keyOf=q=>byIsl?islOf(q):q.lm, nameOf=k=>byIsl?(ISL[k]?ISL[k].name:''):lmName(k);
  const byLm={}; S.qs.forEach((q,i)=>{ const k=keyOf(q); if(!k) return; (byLm[k]=byLm[k]||[0,0])[1]++; if(S.results[i]) byLm[k][0]++; });
  const lmKeys=Object.keys(byLm).filter(k=>nameOf(k));
  let diag='';
  if(S.o.scope==='exam') diag+='<p class="section-label">作答時間</p><p class="note">共 '+fmtTime(Date.now()-S.t0)+'，平均每題 '+Math.round((Date.now()-S.t0)/1000/n)+' 秒</p>';
  if(lmKeys.length>1){
    const rows=lmKeys.map(k=>({k,name:nameOf(k),c:byLm[k][0],n:byLm[k][1]})).sort((a,b)=>a.c/a.n-b.c/b.n);
    const weakest=rows.find(r=>r.n>=2 && r.c<r.n && (byIsl?ISL[r.k]:LM_INFO[r.k]));
    diag+='<p class="section-label">'+(byIsl?'各島表現':'各小主題表現')+'</p><ul class="lm-score">'+rows.map(r=>'<li><span>'+r.name+'</span><span class="bar2"><i style="width:'+(r.c/r.n*100)+'%"></i></span><b>'+r.c+'/'+r.n+'</b></li>').join('')+'</ul>'+
      (weakest?'<div class="tipcard"><div><p class="tip-title">建議下一步</p><p class="tip-text">這一輪「'+weakest.name+'」最需要加強。</p></div><button type="button" class="btn" id="rWeak" data-'+(byIsl?'isl':'lm')+'="'+weakest.k+'">去練習</button></div>':'');
  }
  body.innerHTML=
    '<div class="rhero"><div class="rring" style="--p:'+(ratio*100).toFixed(0)+'" role="img" aria-label="答對 '+c+' 題，共 '+n+' 題"><span><b>'+c+'</b><small>/'+n+'</small></span></div>'+
    '<div class="rtext"><p class="rtitle">'+(ratio===1?'全部答對':ratio>=0.7?'表現不錯':'再加把勁')+'</p><p class="result-msg">'+msg+'</p><ul class="breakdown">'+bd+'</ul></div></div>'+
    '<div class="actions">'+
      (S.wrong.length ? '<button type="button" class="btn primary" id="rWrong">只練這次錯題（'+S.wrong.length+'）</button>' : '')+
      (S.o.scope!=='retry' ? '<button type="button" class="btn'+(S.wrong.length?'':' primary')+'" id="rMore">再來 '+(S.o.scope==='exam'?S.o.n:ST.n)+' 題</button>' : '')+
      '<button type="button" class="btn" id="rBack">回到島上</button>'+
    '</div>'+diag+
    (S.wrong.length ? '<p class="section-label">答錯的題目</p><ul class="wrong-list">'+S.wrong.map(q=>'<li>'+(q.ctx?'<p class="nb-ctx">'+esc(q.ctx)+'</p>':'')+'<p class="wq">'+esc(q.q)+'</p><div class="wa"><span class="fb-label">正解</span>'+fmtOpt(q.c)+'</div></li>').join('')+'</ul>' : '');
  const w=$('#rWrong'); if(w){ const list=S.wrong.slice(), il=S.info.isl; w.addEventListener('click',()=>startQuiz({scope:'retry', isl:il, list})); }
  const m=$('#rMore'); if(m){ const o=S.o; m.addEventListener('click',()=>startQuiz(o)); }

  scrollTop0();
  const f=body.querySelector('.btn'); if(f) f.focus({preventScroll:true}); scrollTop0(); requestAnimationFrame(scrollTop0);
}

  function makePerson(sp){
    const g=new T.Group(), s=sp.small?0.82:1;
    const part=(geo,c,x,y,z,parent)=>{ const m=M(geo,c,x,y,z); m.raycast=()=>{}; (parent||g).add(m); return m; };
    const hip=new T.Group(); hip.position.y=0.32; g.add(hip);
    const legL=new T.Group(); legL.position.set(-0.06,0,0); hip.add(legL);
    const legR=new T.Group(); legR.position.set(0.06,0,0); hip.add(legR);
    part(new T.BoxGeometry(0.09,0.32,0.1),sp.bottom||sp.top,0,-0.16,0,legL);
    part(new T.BoxGeometry(0.09,0.32,0.1),sp.bottom||sp.top,0,-0.16,0,legR);
    if(sp.robe) part(new T.CylinderGeometry(0.13,0.19,0.6,8),sp.top,0,0.34,0);
    else part(new T.BoxGeometry(0.26,0.32,0.16),sp.top,0,0.48,0);
    if(sp.collar) part(new T.CylinderGeometry(0.17,0.17,0.04,10),'#f4f1ea',0,0.65,0);
    if(sp.tie) part(new T.BoxGeometry(0.05,0.2,0.02),'#b5333a',0,0.52,0.085);
    if(sp.pack) part(new T.BoxGeometry(0.2,0.24,0.1),sp.packC||'#5a4a3a',0,0.48,-0.13);
    part(new T.SphereGeometry(0.11,10,8),sp.skin||'#e8c4a0',0,0.76,0);
    if(sp.hat!=='hood') [-0.04,0.04].forEach(x=>part(new T.BoxGeometry(0.022,0.03,0.01),'#1a1a1a',x,0.775,0.106));
    if(sp.beard) part(new T.BoxGeometry(0.14,0.07,0.06),sp.hair||'#5a4a3a',0,0.69,0.08);
    const hc=sp.hatC||'#1d1d22';
    switch(sp.hat){
      case 'brim': part(new T.CylinderGeometry(0.21,0.21,0.02,14),hc,0,0.84,0); part(new T.CylinderGeometry(0.1,0.11,0.11,12),hc,0,0.9,0); break;
      case 'tophat': part(new T.CylinderGeometry(0.17,0.17,0.02,14),hc,0,0.84,0); part(new T.CylinderGeometry(0.1,0.1,0.2,12),hc,0,0.95,0); break;
      case 'skullcap': part(new T.SphereGeometry(0.116,10,6,0,TAU0,0,Math.PI/2),hc,0,0.78,0); part(new T.SphereGeometry(0.025,6,4),'#b5333a',0,0.9,0); break;
      case 'helmet': part(new T.ConeGeometry(0.135,0.17,10),hc,0,0.9,0); part(new T.CylinderGeometry(0.125,0.125,0.04,10),'#3a3a3a',0,0.81,0); break;
      case 'police': part(new T.CylinderGeometry(0.115,0.11,0.08,12),hc,0,0.87,0); part(new T.BoxGeometry(0.13,0.015,0.08),'#111',0,0.83,0.09); break;
      case 'schoolcap': part(new T.CylinderGeometry(0.115,0.115,0.06,12),hc,0,0.86,0); part(new T.BoxGeometry(0.12,0.015,0.08),'#111',0,0.83,0.09); break;
      case 'cap': part(new T.SphereGeometry(0.117,10,6,0,TAU0,0,Math.PI/2),hc,0,0.79,0); part(new T.BoxGeometry(0.12,0.015,0.1),hc,0,0.8,0.1); break;
      case 'cloche': part(new T.SphereGeometry(0.13,10,6,0,TAU0,0,Math.PI/2),hc,0,0.78,0); part(new T.CylinderGeometry(0.16,0.16,0.015,12),hc,0,0.79,0); break;
      case 'conical': part(new T.ConeGeometry(0.26,0.13,12),hc,0,0.91,0); break;
      case 'hood': part(new T.SphereGeometry(0.128,10,8),hc,0,0.77,-0.01); part(new T.BoxGeometry(0.15,0.07,0.04),'#2b3a4a',0,0.77,0.11); break;
      case 'band': part(new T.TorusGeometry(0.11,0.02,4,12),hc,0,0.8,0).rotation.x=Math.PI/2; part(new T.SphereGeometry(0.113,10,6,0,TAU0,0,Math.PI/2.4),sp.hair||'#1d1d1d',0,0.78,0); break;
      case 'scarf': part(new T.SphereGeometry(0.122,10,6,0,TAU0,0,Math.PI/1.8),hc,0,0.77,-0.005); break;
      case 'scholar': part(new T.BoxGeometry(0.2,0.1,0.18),hc,0,0.88,0); break;
      case 'nemes': part(new T.SphereGeometry(0.12,10,6,0,TAU0,0,Math.PI/2),hc,0,0.78,0); part(new T.BoxGeometry(0.24,0.2,0.05),hc,0,0.7,-0.08); part(new T.BoxGeometry(0.25,0.03,0.06),'#e3b23c',0,0.79,-0.06); break;
      case 'knight': part(new T.CylinderGeometry(0.125,0.125,0.2,10),hc,0,0.79,0); part(new T.BoxGeometry(0.15,0.02,0.02),'#222',0,0.79,0.125); break;
      default: part(new T.SphereGeometry(0.114,10,6,0,TAU0,0,Math.PI/2.2),sp.hair||'#1d1d1d',0,0.78,-0.005);
    }
    if(sp.queue) part(new T.BoxGeometry(0.03,0.26,0.03),'#1d1d1d',0,0.6,-0.11);
    const armL=new T.Group(); armL.position.set(-0.17,0.62,0); g.add(armL);
    const armR=new T.Group(); armR.position.set(0.17,0.62,0); g.add(armR);
    part(new T.BoxGeometry(0.07,0.28,0.08),sp.top,0,-0.14,0,armL);
    part(new T.BoxGeometry(0.07,0.28,0.08),sp.top,0,-0.14,0,armR);
    const hand=new T.Group(); hand.position.set(0,-0.28,0.02); armR.add(hand);
    switch(sp.prop){
      case 'pot': { const p=new T.LatheGeometry([[0,0],[0.07,0.01],[0.09,0.07],[0.06,0.14],[0.065,0.17]].map(q=>new T.Vector2(q[0],q[1])),8); part(p,'#b0703f',0,-0.02,0.06,hand); break; }
      case 'cloth': part(new T.BoxGeometry(0.16,0.2,0.02),'#d7542b',0,-0.08,0.06,hand); part(new T.BoxGeometry(0.16,0.04,0.025),'#222',0,-0.06,0.06,hand); break;
      case 'musket': part(new T.BoxGeometry(0.03,0.75,0.04),'#3a2a1e',0,0.2,0.04,hand); break;
      case 'spear': part(new T.CylinderGeometry(0.012,0.012,0.95,5),'#6b4f36',0,0.25,0.04,hand); part(new T.ConeGeometry(0.03,0.1,5),'#b8b8b8',0,0.77,0.04,hand); break;
      case 'flag': part(new T.CylinderGeometry(0.01,0.01,0.85,5),'#5a4a3a',0,0.25,0.04,hand); part(new T.BoxGeometry(0.02,0.18,0.26),sp.flagC||'#c0392b',0,0.56,0.17,hand); break;
      case 'abacus': part(new T.BoxGeometry(0.18,0.1,0.03),'#6b3f26',0,-0.02,0.06,hand); break;

    { let best=null,bd=rad||30; crossObjs.forEach(o=>{ v.copy(o.boat.position); v.y+=1.0; v.project(camera); if(v.z>1) return; const sx=(v.x*0.5+0.5)*r.width+r.left, sy=(-v.y*0.5+0.5)*r.height+r.top; const dd=Math.hypot(sx-cx,sy-cy); if(dd<bd){ bd=dd; best=o.i; } }); if(best!=null) return {cross:best}; }
    if(focusId && islands[focusId].arch && cam.dist<95){ const lh=ray.intersectObjects(linkPickers,false); if(lh.length) return {link:lh[0].object.userData.link}; }
    const hits=ray.intersectObjects(islPickers,true);
    for(const h of hits){ let o=h.object, lm=null; while(o && !o.userData.islId){ if(o.userData.lmId) lm=o.userData.lmId; o=o.parent; } if(o && o.userData.islId==='_hub') return {hub:true}; o=h.object; lm=null; while(o && !o.userData.islId){ if(o.userData.lmId) lm=o.userData.lmId; o=o.parent; } if(o){ if(lm && focusId===o.userData.islId) return {isl:o.userData.islId,lm}; return {isl:o.userData.islId}; } }
    return null;
  }

  const spotMat=new T.MeshBasicMaterial({color:'#ffd36a',transparent:true,opacity:0.6,depthWrite:false});
  const spotGeo=new T.RingGeometry(1.75,2.05,48); spotGeo.rotateX(-Math.PI/2);
  const spot=new T.Mesh(spotGeo,spotMat); spot.visible=false; spot.raycast=()=>{}; spot.renderOrder=3; scene.add(spot);
  const spot2=spot.clone(); spot2.visible=false; scene.add(spot2);

  /* --- 迴圈 --- */
  const v=new T.Vector3(), routeCol=new T.Color();
  let last=performance.now(), time=0;
  let paused=false;
  let firstFrameDone=false;
  function frame(now){
    if(paused) return;
    const dt=Math.min(0.05,(now-last)/1000); last=now; time+=dt; const lmF=lmFocus||chapFocus;
    if(!interacted && !reduceMotion) cam.tYaw+=dt*0.05;
    if(lmF && panel.hidden && !reduceMotion && !pointers.size && now-lastInput>2500) cam.tYaw+=dt*0.22;
    const k=reduceMotion?1:1-Math.pow(0.003,dt);
    cam.yaw+=(cam.tYaw-cam.yaw)*k; cam.pitch+=(cam.tPitch-cam.pitch)*k; cam.dist+=(cam.tDist-cam.dist)*k; cam.target.lerp(cam.tTarget,k);
    camera.position.set(cam.target.x+cam.dist*Math.cos(cam.pitch)*Math.sin(cam.yaw), cam.target.y+cam.dist*Math.sin(cam.pitch), cam.target.z+cam.dist*Math.cos(cam.pitch)*Math.cos(cam.yaw));
    camera.lookAt(cam.target);
    sky.position.copy(camera.position); stars.position.copy(camera.position); orb.position.copy(camera.position).add(orbOff); halo.position.copy(orb.position);
    const open=!panel.hidden;
    const tx=open&&!narrow()?Math.min(220,W*0.22):(!focusId&&!narrow()?-Math.min(150,W*0.1):0);
    const archF=focusId&&islands[focusId].arch&&!lmF&&linkFocus==null;
    const ty=narrow()?(open?H*0.25:(lmF||linkFocus!=null||crossFocus!=null?H*0.2:(focusId?H*(archF?0.17:0.13):-H*0.09))):((lmF||linkFocus!=null||crossFocus!=null)&&!open?H*0.13:(focusId&&!open?H*(archF?0.15:0.06):0));
    off.x+=(tx-off.x)*k; off.y+=(ty-off.y)*k; camera.setViewOffset(W,H,off.x,off.y,W,H);
    scene.fog.near=cam.dist*0.9; scene.fog.far=cam.dist*2.6+80;
    const sc=clamp(cam.dist*0.55,10,70), shc=sun.shadow.camera, sd=Math.max(30,sc*1.4);
    sun.position.copy(cam.target).addScaledVector(sunOff,sd/sunOff.length()); sun.target.position.copy(cam.target); sun.target.updateMatrixWorld();
    if(Math.abs(shc.right-sc)>0.5){ shc.left=-sc; shc.right=sc; shc.top=sc; shc.bottom=-sc; shc.near=Math.max(0.5,sd-sc*1.2); shc.far=sd+sc*1.2; shc.updateProjectionMatrix(); }
    if(!reduceMotion){ updateWalkers(dt); updateDeco(dt,time); }
    // 近看地標時，腳下的光環
    const pulse=Math.sin(time*2.4); spotMat.opacity=0.45+0.25*pulse;
    if(lmF && lmGroups[lmF]){ lmGroups[lmF].getWorldPosition(spot.position); spot.position.y=0.6; spot.visible=true; spot.scale.setScalar(1+0.04*pulse); spot2.visible=false; }
    else if(crossFocus!=null && crossObjs[crossFocus]){ const L=CROSS[crossFocus]; lmGroups[L.a].getWorldPosition(spot.position); lmGroups[L.b].getWorldPosition(spot2.position); spot.position.y=spot2.position.y=0.6; spot.visible=spot2.visible=true; spot.scale.setScalar(1+0.04*pulse); spot2.scale.setScalar(1+0.04*pulse); }
    else if(linkFocus!=null && linkObjs[linkFocus]){ const L=LINKS[linkFocus]; lmGroups[L.a].getWorldPosition(spot.position); lmGroups[L.b].getWorldPosition(spot2.position); spot.position.y=spot2.position.y=0.6; spot.visible=spot2.visible=true; spot.scale.setScalar(1+0.04*pulse); spot2.scale.setScalar(1+0.04*pulse); }
    else { spot.visible=false; spot2.visible=false; }
    // 因果航線：聚焦的線最亮，其他變淡；小箱子沿線搬運
    linkObjs.forEach(o=>{
      const L=LINKS[o.i]; let want=0.75;
      if(linkFocus!=null) want=o.i===linkFocus?1:0.18;
      else if(lmF) want=(L.a===lmF||L.b===lmF)?0.4:0.08;
      if(hover&&hover.link===o.i) want=1;
      if(!focusId || !islands[focusId].arch) want=Math.min(want,0.55);
      o.op+=(want-o.op)*k; o.mat.opacity=o.op; o.gmat.opacity=o.op*0.3;
      if(!reduceMotion){ o.t=(o.t+dt*2.2/o.len)%1; }
      o.curve.getPoint(o.t,o.crate.position); o.crate.position.y+=0.22; o.crate.rotation.y=time*1.5+o.i;
      o.crate.visible=o.op>0.3;
    });
    crossObjs.forEach(o=>{
      const want=crossFocus!=null?(o.i===crossFocus?0.95:0.15):((hover&&hover.cross===o.i)?0.9:0.4); o.op+=(want-o.op)*k; o.wm.opacity=o.op;
      if(!reduceMotion){ if(o.wait>0) o.wait-=dt; else { o.t+=o.dir*dt*2.6/o.len; if(o.t>1||o.t<0){ o.t=Math.max(0,Math.min(1,o.t)); o.dir*=-1; o.wait=2.5; } } }
      const pt=o.curve.getPoint(o.t), tg=o.curve.getTangent(o.t).multiplyScalar(o.dir);
      o.boat.position.set(pt.x,-0.12+Math.sin(time*1.6+o.i)*0.06,pt.z); o.boat.rotation.y=Math.atan2(-tg.z,tg.x); o.boat.rotation.z=Math.sin(time*1.2+o.i)*0.05;

    routeList.forEach(routeDots=>{ const n=routeDots.userData.n, head=(time*0.35)%1.25; for(let k2=0;k2<n;k2++){ const d=head-k2/n; const b=d>=0&&d<0.12?1-d/0.12:0; routeCol.setRGB(0.95+0.05*b,0.94-0.1*b,0.92-0.55*b); routeDots.setColorAt(k2,routeCol); } routeDots.instanceColor.needsUpdate=true; });

      if(s.fog && s.fog.visible){ if(!reduceMotion) s.fog.rotation.y+=dt*0.12; const fm=s.fog.userData.mat, fw=lmF&&lmGroups[lmF]&&lmGroups[lmF].parent===s.ig?0.1:0.6; fm.opacity+=(fw-fm.opacity)*k; }
      if(s.pop>0){ s.pop=Math.max(0,s.pop-dt*1.4); s.ig.position.y=Math.sin(s.pop*Math.PI)*0.6; }
      const s3=s.grow[2]; if(s3 && s3.visible && s3.userData.flag && !reduceMotion){ s3.userData.flag.rotation.y=Math.sin(time*1.8+s.la)*0.25; s3.userData.halo.material.opacity=0.35+0.2*Math.sin(time*2+s.la); }
    });
    if(!reduceMotion){ animateWater(time); spinners.forEach(o=>o.o.rotation[o.ax]+=dt*o.sp); beams.forEach(b=>b.rotation.y+=dt*0.9); clouds.forEach(c=>c.userData.a+=dt*c.userData.sp); }
    clouds.forEach(c=>{ c.visible=cloudsOn && cam.dist<230; const u=c.userData; c.position.set(Math.sin(u.a)*u.r,u.y,Math.cos(u.a)*u.r); c.rotation.y=u.a; });
    Object.keys(lmGroups).forEach(id=>{ const g=lmGroups[id]; const want=LMS*((hover&&hover.lm===id)||(S&&S.o.scope==='lm'&&S.o.id===id)?1.1:1); g.userData.s+=(want-g.userData.s)*k; g.scale.setScalar(g.userData.s); });

    renderer.render(scene,camera);
    if(!firstFrameDone){ firstFrameDone=true; if(window.__firstFrame) window.__firstFrame(); }

    // 島嶼標籤
    ISLANDS.forEach(isl=>{
      const I=islands[isl.id], el=islLabel[isl.id];
      const focused=focusId===isl.id;
      v.set(I.pos.x, I.labelH+(focused?1.2:0), I.pos.z); v.project(camera);
      const vis=v.z<1 && !(focusId && focused && cam.dist<(I.arch?85:60));
      el.style.transform='translate('+((v.x*0.5+0.5)*W).toFixed(1)+'px,'+((-v.y*0.5+0.5)*H).toFixed(1)+'px) translate(-50%,calc(-100% - 10px))';
      const op = !vis?0 : (focusId && !focused ? 0.55 : 1);
      el.style.opacity=op; el.style.pointerEvents=op>0.5?'auto':'none';
    });
    // 島名標籤互相重疊時，藏起比較遠的那一個
    { const vis=ISLANDS.map(isl=>{ const el=islLabel[isl.id]; if(el.style.opacity==='0') return null; const I=islands[isl.id]; v.set(I.pos.x,I.labelH,I.pos.z).project(camera); const w=el.offsetWidth||120, h=el.offsetHeight||36; const x=(v.x*0.5+0.5)*W, y=(-v.y*0.5+0.5)*H; return {el,z:v.z,x0:x-w/2,x1:x+w/2,y0:y-h-10,y1:y-10}; }).filter(Boolean).sort((a,b)=>a.z-b.z);
      const kept=[]; vis.forEach(r=>{ if(kept.some(k=>r.x0<k.x1+4&&r.x1>k.x0-4&&r.y0<k.y1+2&&r.y1>k.y0-2)){ r.el.style.opacity='0'; r.el.style.pointerEvents='none'; } else kept.push(r); }); }
    // 小人說明泡泡
    if(bubbleW!=null){ const w=walkers[bubbleW]; if(now>bubbleUntil || cam.dist>80){ bubbleEl.hidden=true; bubbleW=null; } else { v.set(w.pos.x,w.pos.y+1.0,w.pos.z).project(camera); bubbleEl.style.transform='translate('+((v.x*0.5+0.5)*W).toFixed(1)+'px,'+((-v.y*0.5+0.5)*H).toFixed(1)+'px) translate(-50%,calc(-100% - 8px))'; bubbleEl.style.opacity=v.z>1?0:1; } }
    // 地標標籤（只在飛到該島時顯示）
    Object.keys(lmGroups).forEach(id=>{
      const g=lmGroups[id], el=lmLabel[id]||chapLabel[id], islId=(LM_INFO[id]||CHAP_INFO[id]).isl;
      const show=focusId===islId && cam.dist<(islands[islId].arch?90:70);
      if(!show){ if(!el.hidden) el.hidden=true; return; }
      el.hidden=false;
      if(g.userData.top==null){ g.userData.top=new T.Box3().setFromObject(g).max.y; }
      g.getWorldPosition(v); v.y=g.userData.top+0.45; v.project(camera);
      const face=Math.cos(g.userData.angle-cam.yaw);
      const sx=(v.x*0.5+0.5)*W, sy=(-v.y*0.5+0.5)*H;
      const arch=islands[islId].arch;
      let op=(v.z>1||(!arch&&face<-0.15)||lmF||linkFocus!=null||sx<40||sx>W-40||sy<50||sy>H-20)?0:1;
      el.style.transform='translate('+((v.x*0.5+0.5)*W).toFixed(1)+'px,'+((-v.y*0.5+0.5)*H).toFixed(1)+'px) translate(-50%,calc(-100% - 10px))';
      el.style.opacity=op.toFixed(2); el.style.pointerEvents=op>0.5?'auto':'none'; el.style.zIndex=String(Math.round((face+1)*50));
    });
    // 錯題島標籤
    { v.set(0,6.2,0).project(camera); const sx=(v.x*0.5+0.5)*W, sy=(-v.y*0.5+0.5)*H; const vis=v.z<1 && !hubFocus && !(focusId && cam.dist<85) && crossFocus==null;
      hubLabel.style.transform='translate('+sx.toFixed(1)+'px,'+sy.toFixed(1)+'px) translate(-50%,calc(-100% - 10px))'; hubLabel.style.opacity=vis?1:0; hubLabel.style.pointerEvents=vis?'auto':'none'; }
    // 跨科航線標籤：滑鼠移到小船上或聚焦時顯示
    crossObjs.forEach(o=>{ const el=crossLabel[o.i]; const show=(hover&&hover.cross===o.i)||crossFocus===o.i; if(!show){ if(!el.hidden) el.hidden=true; return; }
      el.hidden=false; v.copy(o.boat.position); v.y+=3.4; v.project(camera); const sx=(v.x*0.5+0.5)*W, sy=(-v.y*0.5+0.5)*H; el.style.transform='translate('+sx.toFixed(1)+'px,'+sy.toFixed(1)+'px) translate(-50%,-50%)'; el.style.opacity=v.z>1?0:1; el.style.pointerEvents='auto'; });
    // 因果航線標籤：在群島上、沒有近看單一地標時顯示
    linkObjs.forEach(o=>{
      const el=linkLabel[o.i]; const show=focusId===LM_INFO[LINKS[o.i].a].isl && cam.dist<95 && !lmF && linkFocus==null;
      if(!show){ if(!el.hidden) el.hidden=true; return; }
      el.hidden=false; v.copy(o.apex); v.y+=0.3; v.project(camera);
      const sx=(v.x*0.5+0.5)*W, sy=(-v.y*0.5+0.5)*H;
      const op=(v.z>1||sx<30||sx>W-30||sy<40||sy>H-20)?0:1;
      el.style.transform='translate('+sx.toFixed(1)+'px,'+sy.toFixed(1)+'px) translate(-50%,-50%)';
      el.style.opacity=op; el.style.pointerEvents=op>0.5?'auto':'none';
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  return {
    pause(){ paused=true; },
    resume(){ if(!paused) return; paused=false; last=performance.now(); requestAnimationFrame(frame); },
    focus(id){ const I=islands[id]; cam.tTarget.set(I.pos.x,0.8,I.pos.z); cam.tYaw=shortest(cam.tYaw,I.angle); if(I.arch){ cam.tPitch=0.98; cam.tDist=narrow()?90:46; } else { cam.tPitch=0.62; cam.tDist=(narrow()?44:30)*(I.R/8.4); } },
    overview(){ cam.tTarget.set(0,0,0); cam.tPitch=0.92; cam.tDist=overD(); },
    focusHub(){ cam.tTarget.set(0,0.6,0); cam.tPitch=0.82; cam.tDist=narrow()?52:34; lastInput=performance.now(); },
    setWrong(c){ if(!bottleMesh) return; const max=bottleMesh.userData.max, tot=c.hist+c.geo+c.civ, n=Math.min(max,tot); const col=new T.Color(); let k=0;
      ['hist','geo','civ'].forEach(sj=>{ const m=tot?Math.round(n*c[sj]/tot):0; for(let j=0;j<m && k<n;j++){ col.set(SUBJ[sj].color).lerp(new T.Color('#ffffff'),0.25); bottleMesh.setColorAt(k++,col); } });
      while(k<n){ bottleMesh.setColorAt(k++,col.set('#9fd0c8')); } bottleMesh.count=n; if(bottleMesh.instanceColor) bottleMesh.instanceColor.needsUpdate=true; },
    cheer(){ const gw=walkers.find(w=>w.guide); if(gw) gw.jump=1; },
    focusCross(i){ const o=crossObjs[i]; if(!o) return; const d=o.pa.distanceTo(o.pb);
      // 俯視兩座島：目標放在兩端點連線與航線中點之間，鏡頭幾乎垂直往下看
      const m=new T.Vector3((o.pa.x+o.pb.x)/2,0,(o.pa.z+o.pb.z)/2).lerp(o.mid,0.35);
      cam.tTarget.set(m.x,0.5,m.z); cam.tPitch=1.18; const asp=Math.max(0.4,Math.min(1.6,W/H)); cam.tDist=clamp((d*0.62/(Math.tan(19*Math.PI/180)*asp))+30,40,520); lastInput=performance.now(); },
    focusLink(i){ const o=linkObjs[i]; if(!o) return; const I=islands[LM_INFO[LINKS[i].a].isl]; const d=o.pa.distanceTo(o.pb);
      cam.tTarget.set(o.mid.x,1.6,o.mid.z); const off2=new T.Vector3().subVectors(o.mid,I.pos).setY(0);
      let yaw=off2.length()>1.5?Math.atan2(off2.x,off2.z):Math.atan2(o.pb.z-o.pa.z,-(o.pb.x-o.pa.x));
      cam.tYaw=shortest(cam.tYaw,yaw); cam.tPitch=0.55; cam.tDist=(d*1.1+9)*(narrow()?1.55:1); lastInput=performance.now(); },
    // 成長：依熟練度顯示裝飾、起霧；升階時小島彈一下
    setGrowth(map){ Object.keys(map).forEach(id=>{ const s=islets[id]; if(!s) return; const g=map[id];
      s.grow.forEach((gr,k)=>{ gr.visible=g.stage>k; }); s.fog.visible=!!g.fog;
      if(s.stage>=0 && g.stage>s.stage && !reduceMotion) s.pop=1; s.stage=g.stage; }); },
    focusLm(id){ const g=lmGroups[id]; if(!g) return; const bb=new T.Box3().setFromObject(g), sz=new T.Vector3(), c=new T.Vector3(); bb.getSize(sz); bb.getCenter(c); const span=Math.max(sz.x,sz.y,sz.z); cam.tTarget.set(c.x,c.y,c.z); cam.tYaw=shortest(cam.tYaw,g.userData.angle); cam.tPitch=0.5; cam.tDist=(span*2.4+2.5)*(narrow()?1.45:1); lastInput=performance.now(); }
  };
}
})();
