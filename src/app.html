<title>社會科複習島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout：一片海上的 9 座島（3 科 × 3 個年級）；點島嶼飛過去，右側（手機在底部）出現島嶼面板與答題卡；左上角標題與進度，底部是島嶼列 */
:root{
  --fs-1:12px; --fs-2:13px; --fs-3:14px; --fs-4:15px; --fs-5:17px; --fs-6:21px; --fs-7:26px;
  --sky:#bfe1ea; --sky2:#e8f5f7; --sea:#3a97aa;
  --paper:#fbfdfd; --paper2:#eef5f6; --glass:rgba(251,253,253,.88);
  --ink:#1b2a31; --muted:#566870; --line:#d3e1e4; --track:#e1ebed;
  --accent:#e2552d;
  --hist:#c98a3c; --geo:#4f9a45; --civ:#5f7896;
  --ok:#2f8a4e; --ok-bg:#e3f3e8; --bad:#c8402f; --bad-bg:#fbe7e3; --warn:#b7791f;
  --d1:#2f8a4e; --d2:#b7791f; --d3:#c8402f;
  --shadow:0 8px 24px rgba(20,60,70,.16); --shadow-lg:0 18px 48px rgba(20,60,70,.24);
  --f-display:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","KaiTi",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#0e1b2c; --sky2:#1a2c44; --sea:#1b4a60;
    --paper:#13202e; --paper2:#1a2a3b; --glass:rgba(19,32,46,.88);
    --ink:#e5edf1; --muted:#97a9b4; --line:#2a3d50; --track:#24364a;
    --accent:#ff7a52;
    --hist:#e0a65a; --geo:#6fbf63; --civ:#8fa6c6;
    --ok:#4cc27a; --ok-bg:#163526; --bad:#ff7360; --bad-bg:#3b1e1c; --warn:#e3a94a;
    --d1:#4cc27a; --d2:#e3a94a; --d3:#ff7360;
    --shadow:0 8px 24px rgba(0,0,0,.4); --shadow-lg:0 18px 48px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky:#0e1b2c; --sky2:#1a2c44; --sea:#1b4a60;
  --paper:#13202e; --paper2:#1a2a3b; --glass:rgba(19,32,46,.88);
  --ink:#e5edf1; --muted:#97a9b4; --line:#2a3d50; --track:#24364a;
  --accent:#ff7a52;
  --hist:#e0a65a; --geo:#6fbf63; --civ:#8fa6c6;
  --ok:#4cc27a; --ok-bg:#163526; --bad:#ff7360; --bad-bg:#3b1e1c; --warn:#e3a94a;
  --d1:#4cc27a; --d2:#e3a94a; --d3:#ff7360;
  --shadow:0 8px 24px rgba(0,0,0,.4); --shadow-lg:0 18px 48px rgba(0,0,0,.5);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:var(--fs-4);line-height:1.6;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:linear-gradient(var(--sky2),var(--sky))}
#scene.dragging{cursor:grabbing}
#scene.pointing{cursor:pointer}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}

.ui{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  pointer-events:none}
.ui > *{pointer-events:auto}
.spacer{flex:1;pointer-events:none}

.hud{align-self:flex-start;width:min(290px,100%);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:16px 16px 12px;box-shadow:var(--shadow)}
.eyebrow{margin:0;font-size:var(--fs-1);letter-spacing:.14em;color:var(--muted)}
h1{margin:2px 0 12px;font-family:var(--f-display);font-weight:700;font-size:var(--fs-7);line-height:1.15;letter-spacing:.06em;text-wrap:balance}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar span{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--hist),var(--geo),var(--civ));transition:width .6s ease}
.progress p{margin:8px 0 0;font-size:var(--fs-2);color:var(--muted);font-variant-numeric:tabular-nums}
.loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:linear-gradient(var(--sky2),var(--sky));transition:opacity .6s ease;padding-inline:16px}
.loader.done{opacity:0;pointer-events:none}
.ld-card{display:grid;justify-items:center;gap:8px;text-align:center}
.ld-title{margin:0;font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:.08em}
.ld-msg{margin:4px 0 8px;font-size:var(--fs-3);color:var(--muted)}
.ld-bar{width:180px;height:6px;border-radius:99px;background:var(--track);overflow:hidden;position:relative}
.ld-bar i{position:absolute;top:0;bottom:0;width:40%;border-radius:99px;background:linear-gradient(90deg,var(--hist),var(--geo),var(--civ));animation:ld 1.2s ease-in-out infinite}
@keyframes ld{from{left:-40%}to{left:100%}}
#ldLite{margin-top:12px}
.hud-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#examBtn,#searchBtn,#reviewBtn{color:var(--ink);font-weight:600}
#reviewBtn.hasdue{background:var(--accent);border-color:var(--accent);color:#fff}
#reviewBtn:disabled{opacity:.6;cursor:default}
.nextrev{font-size:var(--fs-1);color:var(--muted);margin-right:auto}
.tool{padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--paper);font-size:var(--fs-2);color:var(--muted);cursor:pointer}
@media (pointer:coarse){.tool{min-height:40px;padding:8px 14px;touch-action:manipulation}}
.tool[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.qprog{display:grid;gap:4px;margin:0 0 12px}
.qprog i{height:6px;border-radius:99px;background:var(--track)}
.qprog i.right{background:var(--ok)}
.qprog i.wrong{background:var(--bad)}
.qprog i.now{background:var(--ink)}
.qnum{font-size:var(--fs-2);color:var(--muted);font-variant-numeric:tabular-nums}
.qnum b{font-size:var(--fs-5);color:var(--ink)}
.qtags{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tagchip{font-size:var(--fs-1);padding:2px 8px;border-radius:99px;background:var(--paper2);border:1px solid var(--line);color:var(--muted)}
.fb-head{display:flex;align-items:center;gap:8px}
.fb-icon{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:var(--paper);font-size:var(--fs-2);font-weight:700}
.feedback.bad .fb-icon{background:var(--bad)}
.fb-ans{display:flex;align-items:baseline;gap:8px;margin-top:8px;font-weight:500}
.fb-label{flex:none;font-size:var(--fs-1);font-weight:700;padding:1px 8px;border-radius:6px;background:var(--ok);color:var(--paper)}
.feedback .fb-ex{margin:8px 0 0;line-height:1.75}
.fb-foot{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:4px}
.rpt{position:fixed;inset:0;z-index:450;display:grid;place-items:end center;background:rgba(10,20,30,.45);padding:16px}
@media (min-width:640px){.rpt{place-items:center}}
.rpt-card{width:min(440px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:16px 16px 12px;box-shadow:0 16px 40px rgba(0,0,0,.25)}
.rpt-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rpt-head h3{margin:0;font-size:1.1rem}
.rpt-q{margin:6px 0 10px;color:var(--muted);font-size:var(--fs-2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rpt-lab{display:block;margin:10px 0 6px;font-weight:600;font-size:var(--fs-2)}
.rpt-types{display:flex;flex-wrap:wrap;gap:6px}
.rpt-t{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--track);color:var(--ink);font:inherit;font-size:var(--fs-2);cursor:pointer}
.rpt-t[aria-pressed=true]{background:#e3b23c;border-color:#c99a24;color:#3a2a05;font-weight:600}
.rpt textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:16px;background:var(--paper2);color:var(--ink);resize:vertical}
.rpt-fine{margin:8px 0 0;font-size:var(--fs-1,12px);color:var(--muted)}
.rpt-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.rpt-act .btn[disabled]{opacity:.5;cursor:not-allowed}
.round-list{margin-top:16px;border:1px solid var(--line);border-radius:14px;padding:4px 12px;background:var(--paper2)}
.round-list summary{cursor:pointer;padding:8px 0;font-weight:600;font-size:var(--fs-3)}
.round-list ol{list-style:none;margin:0 0 8px;padding:0}
.round-list li{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:var(--fs-2);line-height:1.5}
.rl-mark{flex:none;width:20px;text-align:center;font-weight:700}
.rl-mark.ok{color:var(--ok)} .rl-mark.bad{color:var(--bad)}
.rl-q{flex:1;min-width:0}
.round-list .rl-rpt{flex:none;margin-top:0;white-space:nowrap}
.fest-badge{display:inline-block;margin:4px 0 0;padding:3px 10px;border-radius:999px;background:#c8402f;color:#fff6dc;font-size:var(--fs-2);font-weight:700}
:root[data-theme=dark] .fest-badge{background:#a8352a}
.rpt-msg{min-height:1.2em;margin:8px 0 0;font-size:var(--fs-2);color:var(--muted)}
body.big .qtext{font-size:var(--fs-7)}
body.big .ctx{font-size:var(--fs-5)}
body.big .opt{font-size:var(--fs-5);padding:16px 16px}
body.big .feedback p,body.big .feedback strong{font-size:var(--fs-5)}
body.big .wq,body.big .wa,body.big .nb-ex{font-size:var(--fs-5)}
.back{margin-top:12px;display:inline-flex;align-items:center;gap:8px;padding:8px 12px 8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:var(--fs-3);cursor:pointer}
.back:hover{border-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:8px 0 0;padding:0;list-style:none;font-size:var(--fs-2);color:var(--muted)}
.legend li{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}

.bottom{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0;pointer-events:none}
.bottom > *{pointer-events:auto}
.hint{margin:0;padding:8px 16px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:var(--fs-2);color:var(--muted);box-shadow:var(--shadow);transition:opacity .4s;text-align:center}
.hint.gone{opacity:0;pointer-events:none}
.dock{max-width:100%;overflow-x:auto;scrollbar-width:none;padding:2px}
.dock::-webkit-scrollbar{display:none}
.dock{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent);padding-inline:12px}
.subrow{display:flex;align-items:center;gap:8px}
.mini{width:44px;height:4px;border-radius:99px;background:var(--track);overflow:hidden}
.mini i{display:block;height:100%;width:0;background:var(--c);border-radius:99px}
.chip.wip{opacity:.78}
.dock-row{display:flex;gap:8px;width:max-content;margin:0 auto}
.chip{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 12px;border-radius:12px;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);cursor:pointer;white-space:nowrap;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.chip:hover{transform:translateY(-2px);border-color:var(--c)}
.chip.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c),var(--shadow)}
.chip .txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.chip .nm{font-weight:700;font-size:var(--fs-3)}
.chip .sub{font-size:var(--fs-1);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.wip .nm{font-weight:500}

/* 浮動標籤 */
.tag3d{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;padding:4px 12px 4px 8px;border-radius:999px;background:var(--paper);border:1.5px solid var(--c);color:var(--ink);font:500 13px/1.3 var(--f-body);white-space:nowrap;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.16);transition:opacity .25s, scale .15s;will-change:transform;pointer-events:auto}
.tag3d::after{content:"";position:absolute;left:50%;bottom:-6px;width:9px;height:9px;background:var(--paper);border-right:1.5px solid var(--c);border-bottom:1.5px solid var(--c);transform:translateX(-50%) rotate(45deg)}
.tag3d .sc{color:var(--muted);font-size:var(--fs-1);font-variant-numeric:tabular-nums}
.tag3d.hover,.tag3d:hover{scale:1.08}
.tag3d.island{padding:4px 12px 4px 8px;border-radius:12px;flex-direction:row}
body:not(.focused) .tag3d.island .sc{display:none}
body:not(.focused) .tag3d.island:hover .sc,body:not(.focused) .tag3d.island.hover .sc{display:block}
.tag3d.island .nm{font-family:var(--f-display);font-size:var(--fs-4);font-weight:700;letter-spacing:.04em}
.tag3d.island .col{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.tag3d.wip{border-style:dashed}
.bubble{position:absolute;left:0;top:0;max-width:min(260px,70vw);display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:12px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);font-size:var(--fs-2);line-height:1.45;box-shadow:var(--shadow);pointer-events:none;z-index:200}
.bubble b{font-size:var(--fs-3)}
.bubble small{color:var(--muted);font-size:var(--fs-1)}
.ring{width:13px;height:13px;border-radius:50%;flex:none;background:conic-gradient(var(--c) calc(var(--p,0)*1%), transparent 0);box-shadow:inset 0 0 0 2px var(--c)}

/* 面板 */
.panel{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100% - 32px));display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);overflow:hidden;animation:slideIn .3s ease}
@keyframes slideIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.panel-head{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:start;padding:16px 16px 16px 20px;border-bottom:1px solid var(--line);background:var(--paper2)}
.zone-tag{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-1);letter-spacing:.12em;color:var(--muted)}
.panel-head h2{margin:0;font-family:var(--f-display);font-size:var(--fs-7);line-height:1.2;letter-spacing:.04em;text-wrap:balance}
.unit{margin:0;font-size:var(--fs-2);color:var(--muted)}
.close{grid-row:1 / span 3;grid-column:2;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:var(--fs-6);line-height:1;cursor:pointer}
.close:hover{border-color:var(--ink)}
.panel-body{flex:1;min-height:0;overflow-y:auto;padding:16px 20px 24px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px 12px;border-radius:12px;background:var(--paper2);display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:var(--fs-7);line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:var(--fs-1);color:var(--muted)}
.section-label{margin:16px 0 8px;font-size:var(--fs-1);letter-spacing:.14em;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--track)}
.seg button{padding:8px 4px;border-radius:9px;border:0;background:transparent;font-size:var(--fs-3);cursor:pointer;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--paper);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.linkbtn{margin-top:8px;padding:0;border:0;background:none;font-size:var(--fs-2);color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkbtn[aria-pressed="true"]{color:var(--warn)}
a.linkbtn{display:inline-block}
.fb-foot{flex-wrap:wrap}
.bk-box{display:grid;gap:8px;margin:8px 0 16px}
.bk-code{width:100%;box-sizing:border-box;min-height:88px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.bk-msg{margin:0;font-size:var(--fs-2);color:var(--muted)}
.bk-msg.ok{color:var(--ok,#2e8b57)}.bk-msg.err{color:var(--warn)}
.copybox{width:100%;box-sizing:border-box;min-height:120px;margin-top:12px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--paper2);color:var(--ink);font:13px/1.5 var(--f-body)}
.seg3{grid-template-columns:repeat(3,1fr)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.fchip{padding:4px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--paper);font-size:var(--fs-2);cursor:pointer;font-variant-numeric:tabular-nums}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.nb{margin-top:16px}
.nb-lm{margin:0 0 2px;font-size:var(--fs-1);color:var(--muted)}
.nb-ex{margin:12px 0 0;padding-top:8px;border-top:1px dashed var(--line);font-size:var(--fs-3);line-height:1.7;color:var(--muted)}
.seg-note{margin:8px 0 0;font-size:var(--fs-2);color:var(--muted)}
.lm-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.lm-row{width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;padding:12px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;transition:border-color .15s}
.lm-row:hover{border-color:var(--ink)}
.lm-name{font-weight:700;font-size:var(--fs-4);display:flex;align-items:center;gap:8px;min-width:0}
.lm-unit{grid-column:1;font-size:var(--fs-2);color:var(--muted);min-width:0}
.lm-meta{grid-column:2;grid-row:1 / span 2;text-align:right;font-size:var(--fs-1);color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.35}
.lm-meta b{display:block;font-size:var(--fs-4);color:var(--ink)}
.meter{grid-column:1 / span 2;height:4px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--ok);border-radius:99px}
.flag{font-size:var(--fs-1);font-weight:700;color:var(--bad);border:1px solid var(--bad);border-radius:6px;padding:0 4px;line-height:1.5}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.plan li{padding:4px 12px;border-radius:99px;background:var(--paper2);border:1px solid var(--line);font-size:var(--fs-2)}
.note{margin:0;font-size:var(--fs-4)}
.fine{margin:16px 0 0;font-size:var(--fs-2);color:var(--muted)}

.qmeta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:var(--fs-2);color:var(--muted);font-variant-numeric:tabular-nums}
.qmeta .left{display:flex;align-items:center;gap:8px}
.pill{font-size:var(--fs-1);font-weight:700;padding:1px 8px;border-radius:99px;border:1.5px solid var(--dc);color:var(--dc)}
.dots{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--track)}
.dots i.right{background:var(--ok)}
.dots i.wrong{background:var(--bad)}
.dots i.now{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--ink)}
